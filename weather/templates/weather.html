<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #011428;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .weather {
            margin-top: 25px;
            text-align: left;
        }

        .weather p {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .weather strong {
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Weather App</h1>

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="city"
                placeholder="Enter city name"
                required
            >

            <button type="submit">
                Check Weather
            </button>
        </form>

        {% if country_code %}

        <div class="weather">

            <h2>Weather Information</h2>

            <p>
                <strong>Country:</strong>
                {{ country_code }}
            </p>

            <p>
                <strong>Coordinates:</strong>
                {{ coordinate }}
            </p>

            <p>
                <strong>Temperature:</strong>
                {{ temp }} °C
            </p>

            <p>
                <strong>Humidity:</strong>
                {{ humidity }}%
            </p>

        </div>

        {% endif %}

    </div>

</body>
</html>
